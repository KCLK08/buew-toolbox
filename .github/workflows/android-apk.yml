name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'expo-toolbox/**'
      - 'shared/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'expo-toolbox/**'
      - 'shared/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Expo Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: expo-toolbox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo-toolbox/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate native Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --non-interactive

      - name: Build debug APK
        working-directory: expo-toolbox/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p dist-apk
          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="${GITHUB_SHA::7}"
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          DEST="dist-apk/buew-toolbox-${VERSION}-${SHORT_SHA}-debug.apk"
          cp "$SRC" "$DEST"
          ls -lh dist-apk
          echo "APK_PATH=$DEST" >> "$GITHUB_ENV"
          echo "APK_NAME=$(basename "$DEST")" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: buew-toolbox-android-apk
          path: expo-toolbox/dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30
