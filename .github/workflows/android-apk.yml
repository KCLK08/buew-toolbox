name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'expo-toolbox/**'
      - 'shared/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'expo-toolbox/**'
      - 'shared/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Typecheck (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo-toolbox/package-lock.json

      - name: Install npm dependencies
        working-directory: expo-toolbox
        run: npm ci

      - name: Typecheck
        working-directory: expo-toolbox
        run: npm run typecheck

  build-apk:
    name: Expo Android APK
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo-toolbox/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        working-directory: expo-toolbox
        run: npm ci

      - name: Typecheck
        working-directory: expo-toolbox
        run: npm run typecheck

      - name: Generate native Android project
        working-directory: expo-toolbox
        env:
          CI: '1'
        run: npx expo prebuild --platform android --non-interactive

      - name: Build standalone release APK
        working-directory: expo-toolbox/android
        run: |
          chmod +x gradlew
          # Release embeds the JS bundle via `export:embed`; debug expects Metro on :8081.
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK file
        id: apk
        working-directory: expo-toolbox
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="${GITHUB_SHA::7}"
          RUN_NUMBER="${GITHUB_RUN_NUMBER}"
          SRC="$GITHUB_WORKSPACE/expo-toolbox/android/app/build/outputs/apk/release/app-release.apk"
          OUT_DIR="$GITHUB_WORKSPACE/expo-toolbox/dist-apk"
          APK_NAME="buew-toolbox-${VERSION}-${SHORT_SHA}.apk"
          APK_ABS="${OUT_DIR}/${APK_NAME}"
          TAG="apk-v${VERSION}.${RUN_NUMBER}"

          test -f "$SRC"
          mkdir -p "$OUT_DIR"
          cp "$SRC" "$APK_ABS"

          # Ensure we publish a real .apk (not a renamed zip wrapper)
          file "$APK_ABS"
          [[ "$APK_NAME" == *.apk ]]
          ls -lh "$APK_ABS"

          # Standalone APK must ship an embedded JS bundle (not Metro dev client).
          if ! unzip -l "$APK_ABS" | grep -qE 'assets/.*(index\.android\.bundle|\.hbc)'; then
            echo "ERROR: No embedded JS bundle found in APK assets."
            unzip -l "$APK_ABS" | grep -E 'assets/' || true
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "apk_name=${APK_NAME}"
            echo "apk_abs=${APK_ABS}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.apk.outputs.tag }}
          VERSION: ${{ steps.apk.outputs.version }}
          SHORT_SHA: ${{ steps.apk.outputs.short_sha }}
          APK_ABS: ${{ steps.apk.outputs.apk_abs }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
        run: |
          set -euo pipefail
          test -f "$APK_ABS"
          test "${APK_ABS##*.}" = "apk"

          NOTES="$(mktemp)"
          cat > "$NOTES" <<EOF
          Automatisch erzeugte **Release-APK** mit eingebettetem JS-Bundle (ohne Metro, direkt installierbar).

          - Version: \`${VERSION}\`
          - Commit: \`${SHORT_SHA}\`
          - Workflow: [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          **Download:** unten die Datei \`${APK_NAME}\` wählen (Endung \`.apk\`, nicht \`.zip\`).
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading APK asset."
            gh release upload "$TAG" "$APK_ABS" --clobber
          else
            gh release create "$TAG" "$APK_ABS" \
              --title "BÜW-Toolbox Android ${VERSION} (#${GITHUB_RUN_NUMBER})" \
              --notes-file "$NOTES" \
              --prerelease
          fi
